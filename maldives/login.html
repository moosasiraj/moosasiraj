<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Maldives Local</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ocean: #0077b6; --ocean-dark: #005f8e; --teal: #00b4d8; --text: #1a202c; --muted: #718096; }
    body {
      font-family: 'Inter', sans-serif; color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0077b6 0%, #00b4d8 50%, #48cae4 100%);
      padding: 20px;
    }
    .card {
      background: #fff; border-radius: 24px; padding: 40px;
      width: 100%; max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-icon { font-size: 2.2rem; display: block; margin-bottom: 6px; }
    .logo-text { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--ocean); font-weight: 700; }
    .logo-sub { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }

    .tabs { display: flex; background: #f0f4f8; border-radius: 12px; padding: 4px; margin-bottom: 28px; }
    .tab {
      flex: 1; padding: 9px; text-align: center; border-radius: 9px;
      font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
      color: var(--muted); border: none; background: transparent; font-family: inherit;
    }
    .tab.active { background: #fff; color: var(--ocean); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    .form-row { margin-bottom: 16px; }
    .form-row label { display: block; font-size: 0.8rem; font-weight: 600; color: #4a5568; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
    .form-row input {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid #dce6ef; border-radius: 10px;
      font-size: 0.9rem; font-family: inherit; outline: none; color: var(--text);
      background: #f7fbff; transition: border-color 0.2s;
    }
    .form-row input:focus { border-color: var(--ocean); background: #fff; }

    .btn-main {
      width: 100%; padding: 13px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, var(--ocean), var(--teal));
      color: #fff; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: opacity 0.2s; margin-top: 4px;
    }
    .btn-main:hover { opacity: 0.9; }

    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--muted); font-size: 0.8rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e2eaf3; }

    .social-btn {
      width: 100%; padding: 11px; border: 1.5px solid #e2eaf3; border-radius: 10px;
      background: #fff; display: flex; align-items: center; justify-content: center;
      gap: 10px; font-size: 0.88rem; font-weight: 500; cursor: pointer;
      font-family: inherit; transition: border-color 0.2s; color: var(--text);
      text-decoration: none; margin-bottom: 10px;
    }
    .social-btn:hover { border-color: #a0aec0; }
    .social-icon { font-size: 1.1rem; }

    .terms { font-size: 0.75rem; color: var(--muted); text-align: center; margin-top: 16px; line-height: 1.5; }
    .terms a { color: var(--ocean); text-decoration: none; }
    .terms a:hover { text-decoration: underline; }

    .back-link { display: block; text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--ocean); text-decoration: none; font-weight: 500; }
    .back-link:hover { text-decoration: underline; }

    .hidden { display: none; }

    .error-msg { background: #fff5f5; border: 1px solid #fed7d7; color: #c53030; border-radius: 8px; padding: 10px 14px; font-size: 0.83rem; margin-bottom: 14px; display: none; }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-icon">🌊</span>
    <div class="logo-text">Maldives Local</div>
    <div class="logo-sub">Discover local island life</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabSignin" onclick="switchTab('signin')">Sign in</button>
    <button class="tab" id="tabRegister" onclick="switchTab('register')">Register</button>
  </div>

  <div id="errorMsg" class="error-msg"></div>

  <!-- Sign in form -->
  <div id="signinForm">
    <div class="form-row">
      <label>Email</label>
      <input type="email" id="siEmail" placeholder="you@example.com">
    </div>
    <div class="form-row">
      <label>Password</label>
      <input type="password" id="siPassword" placeholder="Your password">
    </div>
    <button class="btn-main" onclick="handleSignin()">Sign in</button>
    <div class="divider">or continue with</div>
    <a class="social-btn" href="#" onclick="socialLogin('Google')"><span class="social-icon">🌐</span> Continue with Google</a>
    <a class="social-btn" href="#" onclick="socialLogin('Facebook')"><span class="social-icon">📘</span> Continue with Facebook</a>
  </div>

  <!-- Register form -->
  <div id="registerForm" class="hidden">
    <div class="form-row">
      <label>Full name</label>
      <input type="text" id="regName" placeholder="Your full name">
    </div>
    <div class="form-row">
      <label>Email</label>
      <input type="email" id="regEmail" placeholder="you@example.com">
    </div>
    <div class="form-row">
      <label>Nationality</label>
      <input type="text" id="regNationality" placeholder="e.g. Sri Lankan">
    </div>
    <div class="form-row">
      <label>Password</label>
      <input type="password" id="regPassword" placeholder="At least 8 characters">
    </div>
    <button class="btn-main" onclick="handleRegister()">Create account</button>
    <div class="divider">or continue with</div>
    <a class="social-btn" href="#" onclick="socialLogin('Google')"><span class="social-icon">🌐</span> Continue with Google</a>
  </div>

  <p class="terms">
    By continuing you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.<br>
    Your data is never sold or shared with third parties.
  </p>
  <a href="index.html" class="back-link">← Back to map</a>
</div>

<script>
const params = new URLSearchParams(location.search);
if (params.get('mode') === 'register') switchTab('register');

function switchTab(tab) {
  document.getElementById('signinForm').classList.toggle('hidden', tab !== 'signin');
  document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
  document.getElementById('tabSignin').classList.toggle('active', tab === 'signin');
  document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  document.getElementById('errorMsg').classList.remove('show');
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}

function handleSignin() {
  const email = document.getElementById('siEmail').value.trim();
  const pw = document.getElementById('siPassword').value;
  if (!email || !email.includes('@')) { showError('Please enter a valid email address.'); return; }
  if (!pw) { showError('Please enter your password.'); return; }
  // Demo: redirect to homepage with a logged-in feeling
  sessionStorage.setItem('mlUser', JSON.stringify({ email, name: email.split('@')[0] }));
  window.location.href = 'index.html';
}

function handleRegister() {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pw = document.getElementById('regPassword').value;
  if (!name) { showError('Please enter your full name.'); return; }
  if (!email || !email.includes('@')) { showError('Please enter a valid email address.'); return; }
  if (pw.length < 8) { showError('Password must be at least 8 characters.'); return; }
  sessionStorage.setItem('mlUser', JSON.stringify({ email, name }));
  window.location.href = 'index.html';
}

function socialLogin(provider) {
  alert(`${provider} login would be configured with OAuth credentials in production.`);
}
</script>
</body>
</html>
