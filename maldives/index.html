<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maldives Local — Discover Local Island Life</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #050e1c;
      --bg2:    #0a1628;
      --card:   #0d1f38;
      --border: rgba(77,217,240,0.12);
      --accent: #4dd9f0;
      --accent2:#00e5ff;
      --ocean:  #0077b6;
      --text:   #e8f4ff;
      --muted:  rgba(200,225,255,0.45);
      --sidebar-w: 390px;
    }
    html, body { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); }

    /* ── Header ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: 62px;
      background: rgba(5,14,28,0.96);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 20px; gap: 14px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.4);
    }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--ocean), var(--accent));
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .logo-text { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--accent); font-weight: 700; }

    .search-wrap { flex: 1; max-width: 400px; position: relative; }
    .search-wrap input {
      width: 100%; padding: 9px 16px 9px 40px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 24px; font-size: 0.88rem;
      font-family: inherit; outline: none; color: var(--text);
      transition: border-color 0.2s, background 0.2s;
    }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-wrap input:focus { border-color: rgba(77,217,240,0.4); background: rgba(255,255,255,0.08); }
    .s-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }

    .search-results {
      display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden; z-index: 2000;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }
    .search-results.open { display: block; }
    .s-item {
      padding: 10px 16px; cursor: pointer; font-size: 0.85rem;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--border); transition: background 0.15s;
    }
    .s-item:last-child { border-bottom: none; }
    .s-item:hover { background: rgba(77,217,240,0.08); }
    .s-badge { font-size: 0.72rem; color: var(--muted); background: rgba(255,255,255,0.06); padding: 2px 7px; border-radius: 8px; }
    .s-badge.listed { background: rgba(77,217,240,0.12); color: var(--accent); }

    .header-right { margin-left: auto; display: flex; gap: 8px; }
    .btn-ghost {
      padding: 7px 15px; border: 1px solid var(--border); border-radius: 20px;
      color: var(--muted); font-size: 0.82rem; font-weight: 500;
      background: transparent; cursor: pointer; text-decoration: none;
      transition: all 0.2s; white-space: nowrap; font-family: inherit;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-accent {
      padding: 7px 16px; border: none; border-radius: 20px;
      background: linear-gradient(135deg, var(--ocean), var(--accent));
      color: var(--bg); font-size: 0.82rem; font-weight: 700;
      cursor: pointer; text-decoration: none; transition: opacity 0.2s; white-space: nowrap;
    }
    .btn-accent:hover { opacity: 0.85; }

    /* ── Map ── */
    #map {
      position: fixed; top: 62px; left: 0; right: 0; bottom: 0;
      transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    #map.sb-open { right: var(--sidebar-w); }

    /* ── Sidebar ── */
    #sidebar {
      position: fixed; top: 62px; right: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--bg2);
      border-left: 1px solid var(--border);
      box-shadow: -6px 0 32px rgba(0,0,0,0.5);
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
      z-index: 900; display: flex; flex-direction: column; overflow: hidden;
    }
    #sidebar.open { transform: translateX(0); }

    .sb-img-wrap { position: relative; height: 210px; flex-shrink: 0; overflow: hidden; }
    .sb-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .sb-img-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(5,14,28,0.9) 0%, rgba(5,14,28,0.2) 60%, transparent 100%); }
    .sb-close {
      position: absolute; top: 12px; right: 12px;
      width: 32px; height: 32px; background: rgba(5,14,28,0.7);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border); border-radius: 50%;
      cursor: pointer; font-size: 14px; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .sb-close:hover { background: rgba(77,217,240,0.2); }
    .sb-title-wrap { position: absolute; bottom: 16px; left: 20px; right: 52px; }
    .sb-title-wrap h2 { font-family: 'Playfair Display', serif; font-size: 1.7rem; color: #fff; line-height: 1.2; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    .sb-title-wrap p { font-size: 0.82rem; color: rgba(255,255,255,0.65); margin-top: 3px; }

    .sb-body { flex: 1; overflow-y: auto; padding: 20px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .sb-body::-webkit-scrollbar { width: 4px; }
    .sb-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .island-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.65; margin-bottom: 18px; }

    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
    .tag {
      padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 500;
      background: rgba(77,217,240,0.1); color: var(--accent);
      border: 1px solid rgba(77,217,240,0.2);
    }
    .tag.green { background: rgba(29,233,182,0.1); color: #1de9b6; border-color: rgba(29,233,182,0.2); }
    .tag.coral { background: rgba(255,110,64,0.1); color: #ff7043; border-color: rgba(255,110,64,0.2); }

    .sec-label {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
    }

    /* GH cards */
    .gh-card {
      display: flex; gap: 12px; align-items: flex-start;
      border: 1px solid var(--border); border-radius: 12px;
      padding: 13px; margin-bottom: 9px;
      text-decoration: none; color: var(--text);
      background: rgba(255,255,255,0.02);
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
    }
    .gh-card:hover { border-color: rgba(77,217,240,0.35); background: rgba(77,217,240,0.04); transform: translateX(2px); }
    .gh-thumb { width: 72px; height: 72px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .gh-info { flex: 1; min-width: 0; }
    .gh-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 3px; }
    .gh-stars { color: #ffd740; font-size: 11px; letter-spacing: -1px; }
    .gh-meta { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { font-size: 0.7rem; background: rgba(255,255,255,0.06); color: rgba(200,225,255,0.6); padding: 2px 7px; border-radius: 6px; }
    .gh-price { font-weight: 700; font-size: 0.9rem; color: var(--accent); margin-top: 5px; }
    .gh-price span { font-size: 0.72rem; font-weight: 400; color: var(--muted); }

    /* Journey card */
    .journey-card {
      background: rgba(0,119,182,0.08);
      border: 1px solid rgba(77,217,240,0.15);
      border-radius: 12px; padding: 16px; margin-top: 4px;
    }
    .j-step { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .j-dot { width: 34px; height: 34px; background: rgba(77,217,240,0.15); border: 1px solid rgba(77,217,240,0.3); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
    .j-info strong { display: block; font-size: 0.83rem; font-weight: 600; margin-bottom: 1px; }
    .j-info span { font-size: 0.77rem; color: var(--muted); }
    .j-divider { width: 2px; height: 12px; background: var(--border); margin-left: 16px; }
    .j-total {
      margin-top: 12px; padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.82rem;
    }
    .j-total strong { color: var(--accent); font-size: 0.92rem; }
    .btn-plan {
      display: block; width: 100%; text-align: center; margin-top: 10px;
      padding: 10px; background: linear-gradient(135deg, var(--ocean), var(--accent));
      color: var(--bg); border-radius: 10px; font-weight: 700;
      font-size: 0.85rem; text-decoration: none; border: none; cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-plan:hover { opacity: 0.85; }

    /* Legend */
    .map-legend {
      position: fixed; bottom: 24px; left: 20px; z-index: 800;
      background: rgba(5,14,28,0.88); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 16px; font-size: 0.78rem; color: var(--muted);
    }
    .l-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .l-item:last-child { margin-bottom: 0; }
    .l-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .ld-listed { background: var(--accent); box-shadow: 0 0 0 3px rgba(77,217,240,0.2); }
    .ld-unlisted { background: rgba(200,225,255,0.2); border: 1px solid rgba(200,225,255,0.3); }

    /* Counter */
    .counter {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 800; background: rgba(5,14,28,0.88); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 24px;
      padding: 9px 20px; font-size: 0.82rem; color: var(--muted); white-space: nowrap;
    }
    .counter strong { color: var(--accent); }

    /* Leaflet overrides */
    .leaflet-popup-content-wrapper {
      background: var(--card); border-radius: 12px;
      border: 1px solid var(--border); padding: 0;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .leaflet-popup-content { margin: 0; color: var(--text); }
    .leaflet-popup-tip-container { display: none; }
    .map-popup { padding: 13px 15px; min-width: 150px; }
    .map-popup h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 2px; color: var(--text); }
    .map-popup p { font-size: 0.77rem; color: var(--muted); margin-bottom: 7px; }
    .map-popup .pop-badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 7px; display: inline-block; }
    .pop-listed { background: rgba(77,217,240,0.15); color: var(--accent); }
    .pop-soon   { background: rgba(255,255,255,0.06); color: var(--muted); }

    .leaflet-control-zoom a {
      background: var(--card) !important; color: var(--accent) !important;
      border-color: var(--border) !important;
    }
    .leaflet-control-zoom a:hover { background: rgba(77,217,240,0.15) !important; }
    .leaflet-bar { border: 1px solid var(--border) !important; overflow: hidden; border-radius: 8px !important; }
    .leaflet-attribution-flag { display: none !important; }
    .leaflet-control-attribution { background: rgba(5,14,28,0.8) !important; color: var(--muted) !important; font-size: 10px !important; }
    .leaflet-control-attribution a { color: var(--accent) !important; }

    @media (max-width: 640px) {
      :root { --sidebar-w: 100vw; }
      #map.sb-open { right: 0; }
      .logo-text { display: none; }
      .header-right .btn-ghost { display: none; }
      .counter { display: none; }
    }
  </style>
</head>
<body>

<header>
  <a class="logo" href="#">
    <div class="logo-icon">🌊</div>
    <span class="logo-text">Maldives Local</span>
  </a>
  <div class="search-wrap">
    <span class="s-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search islands, atolls…" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
  <div class="header-right">
    <a href="login.html" class="btn-ghost">Sign in</a>
    <a href="login.html?mode=register" class="btn-accent">Register</a>
  </div>
</header>

<div id="map"></div>

<div id="sidebar">
  <div class="sb-img-wrap">
    <img id="sbImg" src="" alt="">
    <div class="sb-img-overlay"></div>
    <button class="sb-close" onclick="closeSidebar()">✕</button>
    <div class="sb-title-wrap">
      <h2 id="sbTitle"></h2>
      <p id="sbSub"></p>
    </div>
  </div>
  <div class="sb-body" id="sbBody"></div>
</div>

<div class="map-legend">
  <div class="l-item"><div class="l-dot ld-listed"></div> Has accommodation</div>
  <div class="l-item"><div class="l-dot ld-unlisted"></div> No listings yet</div>
</div>
<div class="counter"><strong>3</strong> islands with accommodation</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const ISLANDS = [
  { id:"maamendhoo", name:"Maamendhoo", atoll:"Laamu Atoll", lat:1.9175, lng:73.5220, pop:1200, listed:true,
    image:"https://images.unsplash.com/photo-1540202404-1b927e27fa8b?w=800&q=80",
    desc:"A peaceful local island with turquoise lagoon, excellent snorkeling reefs, and authentic Maldivian island life — far from the resort bubble.",
    tags:["Snorkeling","Diving","Local life","Budget-friendly","Beach"],
    journey:{ steps:[{icon:"✈️",label:"Velana → Kadhoo (MLE→KDO)",detail:"~55 min · $80–120"},{icon:"⛵",label:"Kadhoo → Maamendhoo",detail:"~30 min · $10–15"}], total:"$90–135" },
    guesthouses:[
      { id:"blue-horizon",   name:"Blue Horizon",          rating:4.9, reviews:127, price:45, amenities:["WiFi","AC","Meals","Diving"], img:"https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=300&q=70" },
      { id:"sandy-cove",     name:"Sandy Cove Retreat",    rating:4.4, reviews:63,  price:55, amenities:["WiFi","AC","Café","Kayaks"],  img:"https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?w=300&q=70" },
      { id:"local-dream",    name:"Local Dream Guesthouse",rating:4.1, reviews:38,  price:30, amenities:["WiFi","Meals","Local tours"], img:"https://images.unsplash.com/photo-1565967511849-76a60a516170?w=300&q=70" },
    ]},
  { id:"dhigurah", name:"Dhigurah", atoll:"South Ari Atoll", lat:3.5780, lng:72.9010, pop:650, listed:true,
    image:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&q=80",
    desc:"Home to one of the longest beaches in the Maldives (3 km) and famous for year-round whale shark sightings. A diver's paradise.",
    tags:["Whale sharks","Diving","Long beach","Snorkeling"],
    journey:{ steps:[{icon:"⛵",label:"Velana → Maafushi speedboat",detail:"~90 min · $20–30"},{icon:"⛵",label:"Maafushi → Dhigurah",detail:"~45 min · $15–25"}], total:"$35–55" },
    guesthouses:[
      { id:"whale-shark-inn", name:"Whale Shark Inn",  rating:4.7, reviews:214, price:50, amenities:["WiFi","AC","PADI Dive","Meals"], img:"https://images.unsplash.com/photo-1571896349842-33c89424de2d?w=300&q=70" },
      { id:"beach-breeze",    name:"Beach Breeze",     rating:4.3, reviews:89,  price:40, amenities:["WiFi","Café","Snorkel gear"],   img:"https://images.unsplash.com/photo-1512100356356-de1b841283c8?w=300&q=70" },
    ]},
  { id:"ukulhas", name:"Ukulhas", atoll:"North Ari Atoll", lat:4.0600, lng:72.9270, pop:900, listed:true,
    image:"https://images.unsplash.com/photo-1501854140801-50d01698950b?w=800&q=80",
    desc:"One of the greenest islands in the Maldives, renowned for eco-tourism, turtle nesting sites, and a stunning house reef steps from shore.",
    tags:["Eco-tourism","Turtles","House reef","Green island"],
    journey:{ steps:[{icon:"⛵",label:"Velana → Ukulhas speedboat",detail:"~2 hr · $25–35"}], total:"$25–35" },
    guesthouses:[
      { id:"eco-inn",    name:"Ukulhas Eco Inn",        rating:4.8, reviews:176, price:45, amenities:["WiFi","AC","Eco tours","Turtles"], img:"https://images.unsplash.com/photo-1540541338537-71f37e4d5f74?w=300&q=70" },
      { id:"palm-breeze",name:"Palm Breeze Guesthouse", rating:4.5, reviews:102, price:38, amenities:["WiFi","Breakfast","Bicycles"],     img:"https://images.unsplash.com/photo-1566073771259-6a8506099945?w=300&q=70" },
      { id:"turtle-cove",name:"Turtle Cove Lodge",      rating:4.2, reviews:55,  price:32, amenities:["WiFi","Garden","Meals"],           img:"https://images.unsplash.com/photo-1498503182468-3b51cbb6cb24?w=300&q=70" },
    ]},
  { id:"gan",      name:"Gan",      atoll:"Laamu Atoll",      lat:1.8756,  lng:73.5044, listed:false },
  { id:"maafushi", name:"Maafushi", atoll:"Kaafu Atoll",       lat:3.9435,  lng:73.4900, listed:false },
  { id:"rasdhoo",  name:"Rasdhoo",  atoll:"North Ari Atoll",   lat:4.2605,  lng:72.9935, listed:false },
  { id:"huraa",    name:"Huraa",    atoll:"Kaafu Atoll",        lat:4.4165,  lng:73.5660, listed:false },
  { id:"dhangethi",name:"Dhangethi",atoll:"South Ari Atoll",   lat:3.6600,  lng:72.8700, listed:false },
];

// Map
const map = L.map('map', { center:[3.2,73.2], zoom:8, zoomControl:false, attributionControl:true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://openstreetmap.org/">OSM</a>',
  subdomains:'abcd', maxZoom:19
}).addTo(map);
L.control.zoom({ position:'topright' }).addTo(map);

// Markers
ISLANDS.forEach(island => {
  const size = island.listed ? 16 : 10;
  const icon = L.divIcon({
    className: '',
    html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${island.listed ? '#4dd9f0' : 'rgba(200,225,255,0.25)'};border:${island.listed ? '2.5px solid rgba(255,255,255,0.8)' : '1.5px solid rgba(200,225,255,0.35)'};box-shadow:${island.listed ? '0 0 12px rgba(77,217,240,0.6)' : 'none'}"></div>`,
    iconSize:[size,size], iconAnchor:[size/2,size/2]
  });
  const m = L.marker([island.lat, island.lng], { icon }).addTo(map);
  const popHtml = `<div class="map-popup"><h4>${island.name}</h4><p>${island.atoll}</p><span class="pop-badge ${island.listed ? 'pop-listed' : 'pop-soon'}">${island.listed ? '🏠 '+island.guesthouses.length+' guesthouses' : 'Coming soon'}</span></div>`;
  m.bindPopup(popHtml, { closeButton:false, autoPan:false });
  m.on('mouseover', () => m.openPopup());
  m.on('mouseout',  () => m.closePopup());
  if (island.listed) m.on('click', () => openSidebar(island));
});

// Sidebar
function openSidebar(island) {
  document.getElementById('sbImg').src = island.image;
  document.getElementById('sbTitle').textContent = island.name;
  document.getElementById('sbSub').textContent = `${island.atoll} · Pop. ${island.pop ? island.pop.toLocaleString() : '—'}`;
  document.getElementById('sbBody').innerHTML = buildSidebar(island);
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('map').classList.add('sb-open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('map').classList.remove('sb-open');
}
function buildSidebar(island) {
  const tags = island.tags.map((t,i) => `<span class="tag ${i%3===1?'green':i%3===2?'coral':''}">${t}</span>`).join('');
  const cards = island.guesthouses.map(gh => `
    <a class="gh-card" href="guesthouse.html?id=${gh.id}&island=${island.id}">
      <img class="gh-thumb" src="${gh.img}" alt="${gh.name}" loading="lazy">
      <div class="gh-info">
        <div class="gh-name">${gh.name}</div>
        <div class="gh-meta"><span class="gh-stars">${'★'.repeat(Math.round(gh.rating))}</span> ${gh.rating} (${gh.reviews})</div>
        <div class="chips">${gh.amenities.slice(0,3).map(a=>`<span class="chip">${a}</span>`).join('')}</div>
        <div class="gh-price">$${gh.price} <span>/ night from</span></div>
      </div>
    </a>`).join('');
  const steps = island.journey.steps.map((s,i) =>
    `${i>0?'<div class="j-divider"></div>':''}<div class="j-step"><div class="j-dot">${s.icon}</div><div class="j-info"><strong>${s.label}</strong><span>${s.detail}</span></div></div>`
  ).join('');
  return `
    <p class="island-desc">${island.desc}</p>
    <div class="tag-row">${tags}</div>
    <div class="sec-label">Guest Houses (${island.guesthouses.length})</div>
    ${cards}
    <div class="sec-label" style="margin-top:20px">Getting There from Velana Int'l</div>
    <div class="journey-card">
      ${steps}
      <div class="j-total"><span>Est. journey cost</span><strong>${island.journey.total}</strong></div>
      <a class="btn-plan" href="journey.html?island=${island.id}">Plan my journey ✈️</a>
    </div>`;
}

// Search
const inp = document.getElementById('searchInput');
const res = document.getElementById('searchResults');
inp.addEventListener('input', () => {
  const q = inp.value.toLowerCase().trim();
  if (!q) { res.classList.remove('open'); return; }
  const hits = ISLANDS.filter(i => i.name.toLowerCase().includes(q) || i.atoll.toLowerCase().includes(q)).slice(0,6);
  if (!hits.length) { res.classList.remove('open'); return; }
  res.innerHTML = hits.map(i => `<div class="s-item" onclick="selectIsland('${i.id}')"><span>${i.name}</span><span class="s-badge">${i.atoll}</span>${i.listed?'<span class="s-badge listed">🏠 Listings</span>':''}</div>`).join('');
  res.classList.add('open');
});
document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) res.classList.remove('open'); });
function selectIsland(id) {
  res.classList.remove('open'); inp.value = '';
  const island = ISLANDS.find(i => i.id === id);
  if (!island) return;
  map.flyTo([island.lat, island.lng], 13, { duration:1.4 });
  if (island.listed) setTimeout(() => openSidebar(island), 800);
}
</script>
</body>
</html>
