<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maldives Local — Discover Local Island Life</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ocean:  #0077b6;
      --ocean-dark: #005f8e;
      --teal:   #00b4d8;
      --sand:   #f8f4ed;
      --sand2:  #ede8dc;
      --coral:  #e07a5f;
      --text:   #1a202c;
      --muted:  #718096;
      --white:  #ffffff;
      --sidebar-w: 380px;
    }

    html, body { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; color: var(--text); }

    /* ── Header ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: 60px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,119,182,0.12);
      display: flex; align-items: center; padding: 0 20px; gap: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--ocean), var(--teal));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .logo-text { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--ocean); font-weight: 700; }

    .search-wrap { flex: 1; max-width: 420px; position: relative; }
    .search-wrap input {
      width: 100%; padding: 8px 16px 8px 40px;
      border: 1.5px solid #dce6ef; border-radius: 24px;
      font-size: 0.9rem; font-family: inherit; outline: none;
      background: #f7fbff; color: var(--text);
      transition: border-color 0.2s;
    }
    .search-wrap input:focus { border-color: var(--ocean); }
    .search-wrap .s-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
    .search-results {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: #fff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      border: 1px solid #e2e8f0; z-index: 2000; display: none; overflow: hidden;
    }
    .search-results.open { display: block; }
    .search-item {
      padding: 10px 16px; cursor: pointer; font-size: 0.88rem;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid #f0f4f8; transition: background 0.15s;
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background: #f0f7ff; }
    .search-item .si-badge { font-size: 0.75rem; color: var(--muted); background: #edf2f7; padding: 2px 8px; border-radius: 10px; }

    .header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .btn-outline {
      padding: 7px 16px; border: 1.5px solid var(--ocean); border-radius: 20px;
      color: var(--ocean); font-size: 0.85rem; font-weight: 600;
      background: transparent; cursor: pointer; text-decoration: none;
      transition: all 0.2s; white-space: nowrap;
    }
    .btn-outline:hover { background: var(--ocean); color: #fff; }
    .btn-primary {
      padding: 7px 16px; border: none; border-radius: 20px;
      background: linear-gradient(135deg, var(--ocean), var(--teal));
      color: #fff; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: opacity 0.2s; white-space: nowrap;
    }
    .btn-primary:hover { opacity: 0.9; }

    /* ── Map ── */
    #map {
      position: fixed; top: 60px; left: 0; right: 0; bottom: 0;
      background: #cce8f4;
      transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    #map.sidebar-open { right: var(--sidebar-w); }

    /* ── Sidebar ── */
    #sidebar {
      position: fixed; top: 60px; right: 0; bottom: 0;
      width: var(--sidebar-w); background: var(--white);
      box-shadow: -4px 0 24px rgba(0,0,0,0.1);
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
      z-index: 900; display: flex; flex-direction: column;
      overflow: hidden;
    }
    #sidebar.open { transform: translateX(0); }

    .sidebar-header {
      position: relative; flex-shrink: 0;
      height: 200px; overflow: hidden;
    }
    .sidebar-header img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .sidebar-header-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 50%);
    }
    .sidebar-header-content {
      position: absolute; bottom: 16px; left: 20px; right: 50px; color: #fff;
    }
    .sidebar-header-content h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; line-height: 1.2; }
    .sidebar-header-content p { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }
    .sidebar-close {
      position: absolute; top: 12px; right: 12px; z-index: 10;
      width: 32px; height: 32px; background: rgba(255,255,255,0.9);
      border: none; border-radius: 50%; cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center; color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2); transition: background 0.15s;
    }
    .sidebar-close:hover { background: #fff; }

    .sidebar-body { flex: 1; overflow-y: auto; padding: 20px; }

    .island-desc { font-size: 0.88rem; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }

    .island-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
    .tag {
      padding: 4px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: 500;
      background: #e8f4ff; color: var(--ocean);
    }
    .tag.green { background: #e8faf0; color: #276749; }
    .tag.coral { background: #fdf0ed; color: #c05621; }

    .section-title {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
    }

    /* Guest house cards */
    .gh-card {
      border: 1px solid #e8eef5; border-radius: 12px; margin-bottom: 10px;
      padding: 14px; cursor: pointer; transition: all 0.2s;
      display: flex; gap: 12px; align-items: flex-start;
      text-decoration: none; color: inherit;
    }
    .gh-card:hover { border-color: var(--ocean); box-shadow: 0 4px 16px rgba(0,119,182,0.1); transform: translateY(-1px); }
    .gh-thumb {
      width: 72px; height: 72px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
    }
    .gh-info { flex: 1; min-width: 0; }
    .gh-name { font-weight: 600; font-size: 0.92rem; margin-bottom: 3px; }
    .gh-meta { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
    .stars { color: #f6ad55; letter-spacing: -1px; }
    .gh-amenities { display: flex; flex-wrap: wrap; gap: 4px; }
    .amenity-chip { font-size: 0.72rem; background: #f0f4f8; color: #4a5568; padding: 2px 7px; border-radius: 8px; }
    .gh-price { font-weight: 700; font-size: 0.95rem; color: var(--ocean); margin-top: 4px; }
    .gh-price span { font-size: 0.75rem; font-weight: 400; color: var(--muted); }

    /* Journey section */
    .journey-card {
      background: linear-gradient(135deg, #f0f7ff, #e8f4ff);
      border-radius: 12px; padding: 16px; margin-bottom: 20px;
      border: 1px solid #c8dff5;
    }
    .journey-step { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .journey-step:last-of-type { margin-bottom: 0; }
    .j-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--ocean); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
    .j-text { font-size: 0.85rem; }
    .j-text strong { display: block; font-weight: 600; margin-bottom: 1px; }
    .j-text span { color: var(--muted); font-size: 0.8rem; }
    .journey-divider { width: 2px; height: 14px; background: #c8dff5; margin-left: 15px; }
    .journey-total {
      margin-top: 12px; padding-top: 12px; border-top: 1px solid #c8dff5;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.85rem;
    }
    .journey-total strong { font-size: 0.95rem; color: var(--ocean); }
    .btn-plan {
      display: inline-block; width: 100%; text-align: center;
      padding: 10px; background: var(--ocean); color: #fff;
      border-radius: 10px; font-weight: 600; font-size: 0.88rem;
      text-decoration: none; border: none; cursor: pointer;
      margin-top: 10px; transition: background 0.2s;
    }
    .btn-plan:hover { background: var(--ocean-dark); }

    /* ── Map legend ── */
    .map-legend {
      position: fixed; bottom: 30px; left: 20px; z-index: 800;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(8px);
      border-radius: 12px; padding: 12px 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      font-size: 0.8rem; color: var(--text);
      transition: left 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .legend-item:last-child { margin-bottom: 0; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .dot-listed { background: var(--ocean); box-shadow: 0 0 0 3px rgba(0,119,182,0.2); }
    .dot-unlisted { background: #a0aec0; }

    /* ── Floating counter ── */
    .island-counter {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 800;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
      border-radius: 24px; padding: 10px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      font-size: 0.85rem; color: var(--muted); white-space: nowrap;
    }
    .island-counter strong { color: var(--ocean); }

    /* Custom leaflet markers */
    .marker-listed {
      background: var(--ocean); border: 3px solid #fff;
      border-radius: 50%; box-shadow: 0 3px 10px rgba(0,119,182,0.4);
    }
    .marker-unlisted {
      background: #a0aec0; border: 2px solid #fff;
      border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    /* Leaflet overrides */
    .leaflet-popup-content-wrapper {
      border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      border: 1px solid #e2e8f0; padding: 0;
    }
    .leaflet-popup-content { margin: 0; }
    .leaflet-popup-tip-container { display: none; }
    .map-popup { padding: 14px 16px; min-width: 160px; }
    .map-popup h4 { font-size: 0.95rem; font-weight: 700; margin-bottom: 2px; }
    .map-popup p { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }
    .map-popup .popup-badge { font-size: 0.75rem; background: #e8f4ff; color: var(--ocean); padding: 2px 8px; border-radius: 8px; display: inline-block; }

    /* Mobile */
    @media (max-width: 640px) {
      :root { --sidebar-w: 100vw; }
      #map.sidebar-open { right: 0; }
      .logo-text { display: none; }
      .header-actions .btn-outline { display: none; }
      .island-counter { display: none; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <a class="logo" href="#">
    <div class="logo-icon">🌊</div>
    <span class="logo-text">Maldives Local</span>
  </a>
  <div class="search-wrap">
    <span class="s-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search islands, atolls..." autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
  <div class="header-actions">
    <a href="login.html" class="btn-outline">Sign in</a>
    <a href="login.html?mode=register" class="btn-primary">Register</a>
  </div>
</header>

<!-- Map -->
<div id="map"></div>

<!-- Sidebar -->
<div id="sidebar">
  <div class="sidebar-header" id="sidebarHeader">
    <img id="sidebarImg" src="" alt="">
    <div class="sidebar-header-overlay"></div>
    <button class="sidebar-close" onclick="closeSidebar()">✕</button>
    <div class="sidebar-header-content">
      <h2 id="sidebarTitle">Island Name</h2>
      <p id="sidebarAtoll">Atoll · Population</p>
    </div>
  </div>
  <div class="sidebar-body" id="sidebarBody">
    <!-- dynamically filled -->
  </div>
</div>

<!-- Legend -->
<div class="map-legend">
  <div class="legend-item"><div class="legend-dot dot-listed"></div> Has accommodation</div>
  <div class="legend-item"><div class="legend-dot dot-unlisted"></div> No listings yet</div>
</div>

<!-- Counter -->
<div class="island-counter" id="islandCounter">
  Showing <strong>3</strong> islands with accommodation
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

// ── Island + guest house data ──────────────────────────────────────────────
const ISLANDS = [
  {
    id: "maamendhoo",
    name: "Maamendhoo",
    atoll: "Laamu Atoll",
    lat: 1.9175, lng: 73.5220,
    population: 1200,
    listed: true,
    image: "https://images.unsplash.com/photo-1540202404-1b927e27fa8b?w=800&q=80",
    thumbs: [
      "https://images.unsplash.com/photo-1573843981267-be1999ff37cd?w=300&q=70",
      "https://images.unsplash.com/photo-1586500036706-41963de24d8b?w=300&q=70"
    ],
    desc: "A peaceful local island surrounded by turquoise lagoon, known for excellent snorkeling reefs, friendly community, and authentic Maldivian life—far from the resort bubble.",
    tags: ["Snorkeling", "Diving", "Local life", "Budget-friendly", "Beach"],
    journey: {
      domestic: { label: "Velana → Kadhoo (MLE→KDO)", time: "~55 min", price: "$80–120", icon: "✈️" },
      speedboat: { label: "Kadhoo → Maamendhoo", time: "~30 min", price: "$10–15", icon: "⛵" },
      total: "$90–135 + intl flight"
    },
    guesthouses: [
      {
        id: "blue-horizon",
        name: "Blue Horizon",
        rating: 4.9, reviews: 127,
        priceFrom: 45,
        amenities: ["Free WiFi", "AC", "Meals", "Diving"],
        image: "https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=300&q=70"
      },
      {
        id: "sandy-cove",
        name: "Sandy Cove Retreat",
        rating: 4.4, reviews: 63,
        priceFrom: 55,
        amenities: ["WiFi", "AC", "Cafe", "Kayaks"],
        image: "https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?w=300&q=70"
      },
      {
        id: "local-dream",
        name: "Local Dream Guesthouse",
        rating: 4.1, reviews: 38,
        priceFrom: 30,
        amenities: ["WiFi", "Shared bath", "Meals"],
        image: "https://images.unsplash.com/photo-1565967511849-76a60a516170?w=300&q=70"
      }
    ]
  },
  {
    id: "dhigurah",
    name: "Dhigurah",
    atoll: "South Ari Atoll",
    lat: 3.5780, lng: 72.9010,
    population: 650,
    listed: true,
    image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&q=80",
    thumbs: [],
    desc: "Home to one of the longest beaches in the Maldives (3 km of pristine white sand) and famous for whale shark sightings year-round. A diver's paradise accessible by speedboat from Maafushi.",
    tags: ["Whale sharks", "Diving", "Long beach", "Snorkeling"],
    journey: {
      domestic: { label: "Velana → Maafushi (speedboat)", time: "~90 min", price: "$20–30", icon: "⛵" },
      speedboat: { label: "Maafushi → Dhigurah", time: "~45 min", price: "$15–25", icon: "⛵" },
      total: "$35–55 + intl flight"
    },
    guesthouses: [
      {
        id: "whale-shark-inn",
        name: "Whale Shark Inn",
        rating: 4.7, reviews: 214,
        priceFrom: 50,
        amenities: ["WiFi", "AC", "Diving", "Meals"],
        image: "https://images.unsplash.com/photo-1571896349842-33c89424de2d?w=300&q=70"
      },
      {
        id: "beach-breeze",
        name: "Beach Breeze",
        rating: 4.3, reviews: 89,
        priceFrom: 40,
        amenities: ["WiFi", "Snorkel gear", "Cafe"],
        image: "https://images.unsplash.com/photo-1512100356356-de1b841283c8?w=300&q=70"
      }
    ]
  },
  {
    id: "ukulhas",
    name: "Ukulhas",
    atoll: "North Ari Atoll",
    lat: 4.0600, lng: 72.9270,
    population: 900,
    listed: true,
    image: "https://images.unsplash.com/photo-1501854140801-50d01698950b?w=800&q=80",
    thumbs: [],
    desc: "One of the greenest islands in the Maldives, renowned for eco-tourism, turtle nesting sites, and a stunning house reef you can snorkel straight from the shore.",
    tags: ["Eco-tourism", "Turtles", "House reef", "Green island"],
    journey: {
      domestic: { label: "Velana → Ukulhas (speedboat)", time: "~2 hr", price: "$25–35", icon: "⛵" },
      speedboat: null,
      total: "$25–35 + intl flight"
    },
    guesthouses: [
      {
        id: "eco-inn",
        name: "Ukulhas Eco Inn",
        rating: 4.8, reviews: 176,
        priceFrom: 45,
        amenities: ["WiFi", "AC", "Eco tours", "Snorkel gear"],
        image: "https://images.unsplash.com/photo-1540541338537-71f37e4d5f74?w=300&q=70"
      },
      {
        id: "palm-breeze",
        name: "Palm Breeze Guesthouse",
        rating: 4.5, reviews: 102,
        priceFrom: 38,
        amenities: ["WiFi", "Meals", "Bicycle rental"],
        image: "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=300&q=70"
      },
      {
        id: "turtle-cove",
        name: "Turtle Cove Lodge",
        rating: 4.2, reviews: 55,
        priceFrom: 32,
        amenities: ["WiFi", "Garden", "Meals"],
        image: "https://images.unsplash.com/photo-1498503182468-3b51cbb6cb24?w=300&q=70"
      }
    ]
  },
  // Unlisted islands (no accommodation yet)
  { id: "gan", name: "Gan", atoll: "Laamu Atoll", lat: 1.8756, lng: 73.5044, listed: false, population: 4800 },
  { id: "fonadhoo", name: "Fonadhoo", atoll: "Laamu Atoll", lat: 1.8332, lng: 73.5005, listed: false, population: 3100 },
  { id: "maafushi", name: "Maafushi", atoll: "Kaafu Atoll", lat: 3.9435, lng: 73.4900, listed: false, population: 3200 },
  { id: "huraa", name: "Huraa", atoll: "Kaafu Atoll", lat: 4.4165, lng: 73.5660, listed: false, population: 900 },
  { id: "rasdhoo", name: "Rasdhoo", atoll: "North Ari Atoll", lat: 4.2605, lng: 72.9935, listed: false, population: 1500 },
  { id: "dhangethi", name: "Dhangethi", atoll: "South Ari Atoll", lat: 3.6600, lng: 72.8700, listed: false, population: 720 },
];

// ── Map setup ──────────────────────────────────────────────────────────────
const map = L.map('map', {
  center: [3.2, 73.2],
  zoom: 8,
  zoomControl: false,
  attributionControl: true,
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://openstreetmap.org/">OSM</a>',
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);

L.control.zoom({ position: 'topright' }).addTo(map);

// ── Markers ────────────────────────────────────────────────────────────────
ISLANDS.forEach(island => {
  const size = island.listed ? 16 : 10;
  const icon = L.divIcon({
    className: island.listed ? 'marker-listed' : 'marker-unlisted',
    iconSize: [size, size],
    iconAnchor: [size/2, size/2],
  });
  const marker = L.marker([island.lat, island.lng], { icon });
  marker.addTo(map);

  const ghCount = island.listed ? island.guesthouses.length : 0;
  const popupHtml = `
    <div class="map-popup">
      <h4>${island.name}</h4>
      <p>${island.atoll}</p>
      ${island.listed
        ? `<span class="popup-badge">🏠 ${ghCount} guesthouse${ghCount !== 1 ? 's' : ''}</span>`
        : `<span class="popup-badge" style="background:#f0f4f8;color:#718096">No listings yet</span>`}
    </div>`;
  marker.bindPopup(popupHtml, { closeButton: false, autoPan: false });
  marker.on('mouseover', () => marker.openPopup());
  marker.on('mouseout', () => marker.closePopup());

  if (island.listed) {
    marker.on('click', () => openSidebar(island));
  } else {
    marker.on('click', () => marker.openPopup());
  }
});

// ── Sidebar ────────────────────────────────────────────────────────────────
let currentIsland = null;

function openSidebar(island) {
  currentIsland = island;
  document.getElementById('sidebarImg').src = island.image;
  document.getElementById('sidebarTitle').textContent = island.name;
  document.getElementById('sidebarAtoll').textContent =
    `${island.atoll} · Pop. ${island.population.toLocaleString()}`;

  document.getElementById('sidebarBody').innerHTML = buildSidebarHTML(island);
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('map').classList.add('sidebar-open');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('map').classList.remove('sidebar-open');
}

function buildSidebarHTML(island) {
  const tags = island.tags.map((t, i) => {
    const cls = i % 3 === 1 ? 'green' : i % 3 === 2 ? 'coral' : '';
    return `<span class="tag ${cls}">${t}</span>`;
  }).join('');

  const ghCards = island.guesthouses.map(gh => `
    <a class="gh-card" href="guesthouse.html?id=${gh.id}&island=${island.id}">
      <img class="gh-thumb" src="${gh.image}" alt="${gh.name}" loading="lazy">
      <div class="gh-info">
        <div class="gh-name">${gh.name}</div>
        <div class="gh-meta">
          <span class="stars">${'★'.repeat(Math.round(gh.rating))}</span>
          <span>${gh.rating} (${gh.reviews} reviews)</span>
        </div>
        <div class="gh-amenities">
          ${gh.amenities.slice(0,3).map(a => `<span class="amenity-chip">${a}</span>`).join('')}
        </div>
        <div class="gh-price">$${gh.priceFrom} <span>/ night from</span></div>
      </div>
    </a>`).join('');

  const j = island.journey;
  const steps = [
    `<div class="journey-step">
       <div class="j-icon">${j.domestic.icon}</div>
       <div class="j-text"><strong>${j.domestic.label}</strong><span>${j.domestic.time} · ${j.domestic.price}</span></div>
     </div>`
  ];
  if (j.speedboat) {
    steps.push(`<div class="journey-divider"></div>`);
    steps.push(`<div class="journey-step">
       <div class="j-icon">${j.speedboat.icon}</div>
       <div class="j-text"><strong>${j.speedboat.label}</strong><span>${j.speedboat.time} · ${j.speedboat.price}</span></div>
     </div>`);
  }

  return `
    <p class="island-desc">${island.desc}</p>
    <div class="island-tags">${tags}</div>

    <div class="section-title">Guest Houses (${island.guesthouses.length})</div>
    ${ghCards}

    <div class="section-title" style="margin-top:20px">Getting There from Velana Int'l</div>
    <div class="journey-card">
      ${steps.join('')}
      <div class="journey-total">
        <span>Estimated total journey cost</span>
        <strong>${j.total}</strong>
      </div>
      <a class="btn-plan" href="journey.html?island=${island.id}">Plan my journey ✈️</a>
    </div>`;
}

// ── Search ─────────────────────────────────────────────────────────────────
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  if (!q) { searchResults.classList.remove('open'); return; }
  const hits = ISLANDS.filter(i =>
    i.name.toLowerCase().includes(q) || i.atoll.toLowerCase().includes(q)
  ).slice(0, 6);
  if (!hits.length) { searchResults.classList.remove('open'); return; }
  searchResults.innerHTML = hits.map(i => `
    <div class="search-item" onclick="selectIsland('${i.id}')">
      <span>${i.name}</span>
      <span class="si-badge">${i.atoll}</span>
      ${i.listed ? '<span class="si-badge" style="background:#e8f4ff;color:#0077b6">🏠 Listings</span>' : ''}
    </div>`).join('');
  searchResults.classList.add('open');
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) searchResults.classList.remove('open');
});

function selectIsland(id) {
  searchResults.classList.remove('open');
  searchInput.value = '';
  const island = ISLANDS.find(i => i.id === id);
  if (!island) return;
  map.flyTo([island.lat, island.lng], 13, { duration: 1.5 });
  setTimeout(() => { if (island.listed) openSidebar(island); }, 800);
}
</script>
